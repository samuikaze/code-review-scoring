; The settings of one scoring rule (rule.ini). Copy it to the folder of the rule in the rules project and adapt it.
; Register the rule in rules.ini at the root of the rules project:
;   [rule-name]
;   path="the folder of the rule (relative to the root of the rules project)"
;   enable="true"
;
; Every section except [rule] can be left out; what is left out comes from defaults.ini of the rules project.
; Groups are replaced as a whole, not merged key by key:
; - any [severity:*] section replaces the whole severity scale of defaults.ini;
; - any [grade:*] section replaces all the grades of defaults.ini;
; - [scoring] and [points] each replace the whole section.
; defaults.ini has the same format as this file, without [rule].
; Values are always in double quotes; lines starting with ; or # are comments. Run standard lint after a change.

[rule]
; The scoring rule document (Markdown), relative to this folder; required.
; Template: templates/<language>/scoring-rule-template.md
standard="example-cr-scoring-rule.md"
; The automatic scan rules (TSV), relative to this folder; optional.
scan="example-cr-scoring-rule.tsv"
; The files of a framework rule, patterns separated by half-width commas; required for a framework rule.
; A pattern without / matches file names, e.g. *.yml matches YAML files in any folder; a pattern with / matches the
; path from the repository root, and ** spans folders, e.g. src/**/*.yml.
; A pattern may belong to one enabled framework rule only.
applies="*.java, *.kt"
; A common rule sets role="common" instead of applies; at most one common rule can be enabled.
; A common rule never uses [points], [grade:*] or cap of its own rule.ini (lint warns about them): its points and grades
; always come from defaults.ini, and only [scoring] and the severity scale can be overridden.
; role="common"

[scoring]
; true: all locations of one check code are merged into one deduction, deducted once;
; false: every location is deducted.
merge="false"

[points]
; The points of the seven dimensions; they must add up to 100.
A="25"
B="15"
C="15"
D="15"
E="10"
F="10"
G="10"

; The severity scale: one section per severity, from the most severe to the least severe.
; - The code ([severity:CODE]) is the name used by the check items of the document and by findings.txt:
;   letters, digits, _ and -.
; - name: the name shown in the report; optional, the code is shown when it is not set.
; - points: the points deducted per finding; required.
; - meaning: what the severity means; required. The AI judges severities with it, and maps other scales to this one.
;   For several lines, repeat meaning: the lines are joined in order.
; - cap: the highest grade (a [grade:CODE] code) when a deduction has this severity; optional.
; The last severity is the lowest: every check item can be lowered to it, and problems the diff cannot confirm get it.
; The default scale: problems that must be fixed use the classic SonarQube severities Critical, Major and Minor;
; small style issues use Nit from the Google code review guide.
[severity:Critical]
points="10"
cap="B"
meaning="Data corruption, a security incident or an outage."

[severity:Major]
points="5"
meaning="Fails in specific situations, or clearly lowers the quality."

[severity:Minor]
points="2"
meaning="Works, but there is a better way to write it."

[severity:Nit]
points="1"
meaning="A style preference that does not block approval."

; The grades: one section per grade, from the highest to the lowest; codes follow the same rules as severities.
; - name: the name shown in the report; optional, the code is shown when it is not set.
; - min: the lowest total of the grade; required. The values must decrease, and the last grade must be 0.
[grade:A]
min="95"

[grade:B]
min="85"

[grade:C]
min="70"

[grade:D]
min="60"

[grade:F]
min="0"
