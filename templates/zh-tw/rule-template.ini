; 一套評分規則的設定檔（rule.ini）。複製到規則專案中這套規則的目錄後，依需要修改。
; 這套規則要在規則專案根目錄的 rules.ini 登錄：
;   [規則名稱]
;   path="規則目錄（相對於規則專案根目錄）"
;   enable="true"
;
; 除了 [rule] 以外的區段都可以省略；省略的部分使用規則專案 defaults.ini 的設定。
; 取代以群組為單位，不逐鍵合併：
; - 有任何 [severity:*] 區段，就整組取代 defaults.ini 的嚴重度分級。
; - 有任何 [grade:*] 區段，就整組取代 defaults.ini 的等級。
; - [scoring]、[points] 各自整個區段取代。
; defaults.ini 的格式與這個檔案相同，只是沒有 [rule]。
; 值一律以雙引號包住；; 或 # 開頭的行是註解。改完後執行 standard lint 檢查。

[rule]
; 評分規則文件（Markdown），相對於這個目錄；必填。
; 模板：templates/<語言>/scoring-rule-template.md
standard="example-cr-scoring-rule.md"
; 自動掃描規則（TSV），相對於這個目錄；選填。
scan="example-cr-scoring-rule.tsv"
; 框架規則適用的檔案，多個樣式以半形逗號分隔；框架規則必填。
; 不含 / 的樣式比對檔名，例如 *.yml 符合任何目錄下的 YAML 檔；
; 含 / 的樣式比對相對於儲存庫根目錄的路徑，** 可跨目錄，例如 src/**/*.yml。
; 同一個樣式只能屬於一套啟用中的框架規則。
applies="*.java, *.kt"
; 通用規則改寫 role="common"，不寫 applies；啟用中的通用規則最多一套。
; 通用規則不使用自己 rule.ini 的 [points]、[grade:*] 與 cap（lint 會警告）：配分與等級一律使用 defaults.ini，
; 只能覆寫 [scoring] 與嚴重度分級。
; role="common"

[scoring]
; true：同一個檢查代碼的所有位置合併為一筆扣分，只扣一次；
; false：每個位置各扣一次。
merge="false"

[points]
; 七個面向的配分，合計必須為 100。
A="25"
B="15"
C="15"
D="15"
E="10"
F="10"
G="10"

; 嚴重度分級：每個嚴重度一個區段，由上到下為嚴重到不嚴重。
; - 代碼（[severity:代碼]）：規則文件的檢查項與 findings.txt 使用的名稱，
;   限英數字、_ 與 -。
; - name：報告上顯示的名稱，選填；未填時顯示代碼。
; - points：每筆扣分，必填。
; - meaning：意義說明，必填；AI 依它判斷嚴重度，以及把其他分級對應到這套分級。
;   需要多行時重複寫 meaning，各行依序串接。
; - cap：出現這個嚴重度的扣分項時，等級上限為哪一個等級（[grade:代碼] 的代碼）；選填。
; 最後一級是最低級：任何檢查項都可以降為最低級，diff 無法證實的問題也記為最低級。
; 以下為預設分級：必須修正的問題沿用 SonarQube 傳統嚴重度的 Critical／Major／Minor，
; 風格層面的小問題沿用 Google Code Review 指引的 Nit。
[severity:Critical]
name="嚴重"
points="10"
cap="B"
meaning="資料損毀、資安事件或服務中斷。"

[severity:Major]
points="5"
meaning="特定情境下會出錯，或明顯降低品質。"

[severity:Minor]
points="2"
meaning="能運作，但有更好的寫法。"

[severity:Nit]
points="1"
meaning="風格偏好，不影響核准。"

; 等級：每個等級一個區段，由上到下為高到低；代碼的限制與嚴重度相同。
; - name：報告上顯示的名稱，選填；未填時顯示代碼。
; - min：最低總分，必填；必須嚴格遞減，最後一級必須是 0。
[grade:A]
name="優"
min="95"

[grade:B]
min="85"

[grade:C]
min="70"

[grade:D]
min="60"

[grade:F]
min="0"
