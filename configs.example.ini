; 各平台 Sub-Agent 使用的 model 與 reasoning 範例（configs.ini 不進版控）。
; 不需要手動建立：第一次在某個平台以 Sub-Agent 執行完整流程時，主 Agent 會詢問並寫入 configs.ini。
; 若要預先設定，請複製為 configs.ini 後，取消註解要使用的平台區段並修改：
;   cp configs.example.ini configs.ini
; 每個平台一個區段，區段名稱為平台名稱（例如 Claude、Copilot、Codex、Gemini）。
;   model      Sub-Agent 使用的 model，須為該平台 Sub-Agent 工具接受的值。
;   reasoning  Sub-Agent 的 reasoning 等級（GitHub Copilot 目前不會套用，見 docs/notices.md）。
;
; [Claude]
; model="sonnet 5.5"
; reasoning="high"
;
; [Codex]
; model="gpt-5.6"
; reasoning="xhigh"
