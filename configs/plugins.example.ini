; 外掛 Skill 清單範例（plugins.ini 不進版控）。建立 configs/plugins.ini 的方式：
;   - 執行評分時由設定檢查引導建立，或執行 skills/code-review-scoring/scripts/setup.* wizard 逐步建立
;   - 在專案根目錄複製本檔後自行修改：cp configs/plugins.example.ini configs/plugins.ini
; 沒有 configs/plugins.ini 時，評分流程會先要求建立；不使用外掛時，也要建立一份沒有外掛的 plugins.ini（setup plugins --none）。
;
; 外掛 Skill 清單。執行 scripts/link-skills.* 時，會把這裡列出的 Skill 與 skills/ 下的 Skill
; 一起連結到 .agents/skills 等目錄；從清單移除的外掛，下次同步時會一併解除連結。
; 評分流程的步驟 2（CR）會依 PR 異動的檔案與 applies，決定要執行哪些外掛。
;
; 每個外掛一個區段，區段名稱必須和該 Skill 的 SKILL.md 中的 name 一致。
;   path     Skill 資料夾路徑（必填）。相對路徑以本檔所在目錄（configs/）為準。
;   applies  適用的檔案範圍，以逗號分隔的萬用字元（選填，未填表示全部異動檔案）。
;   mode     mapped：CR 意見在分析程式碼時確認，確認屬實的一律扣分，不成立的需說明原因（預設）；
;            advisory：CR 意見只呈現在報告中，不影響分數。
;
; 範例：
; [backend-code-review]
; path="../../shared-skills/backend-code-review"
; applies="*.java,*.kt,*.sql"
; mode="mapped"
;
; [frontend-code-review]
; path="../../shared-skills/frontend-code-review"
; applies="*.ts,*.tsx,*.vue,*.scss"
; mode="advisory"
