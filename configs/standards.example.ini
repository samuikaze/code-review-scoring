; 評分標準清單範例（standards.ini 不進版控）。
; 請在專案根目錄複製為 configs/standards.ini 後修改：
;   cp configs/standards.example.ini configs/standards.ini
;
; 評分標準以 Markdown 撰寫（格式見 docs/templates/scoring-rule-template.md），可以放在專案以外。
; 評分時依各框架標準的 applies 比對 PR 的異動檔案，自動決定適用哪些標準：
;   - 有幾套框架標準符合，就產出幾份報告；
;   - 沒有被任何框架標準涵蓋的檔案，以通用標準（role="common"）評分，併入所屬專案的框架報告；
;   - PR 只異動通用檔案時，以通用標準單獨產出一份報告。
;
; 每套標準一個區段，區段名稱須與標準文件前置資料的 name 一致（英文小寫、數字與 -）。
;   path       標準文件路徑（必填）。相對路徑以本檔所在目錄（configs/）為準。
;              Windows 請使用斜線，例如 C:/Users/me/Documents/standards/springboot-3.md。
;   scan       掃描規則檔（TSV）路徑（選填）；未設定時不列出自動掃描的候選。
;   applies    適用的檔案，以逗號分隔的萬用字元（框架標準必填，通用標準不需設定）：
;                不含 / 的樣式比對檔名，例如 *.yml 符合任何目錄下的 YAML 檔；
;                含 / 的樣式比對相對於儲存庫根目錄的路徑，** 可跨目錄，例如 src/**/*.yml。
;   points.A～points.G
;              覆寫該標準的面向配分（選填）；未覆寫的面向沿用 configs/settings.ini 的 [points]，
;              覆寫後七個面向合計必須為 100。
;   role       設為 "common" 表示通用標準，最多一套。
;
; 範例：
; [springboot-3]
; path="../../standards/springboot-3-cr-scoring-rule.md"
; scan="../../standards/springboot-3-cr-scoring-rule.tsv"
; applies="*.java, *.kt, *.sql, *.xml, *.yml, *.yaml, *.properties, *.gradle, *.kts"
; points.C="20"
; points.F="5"
;
; [common]
; path="../../standards/common-cr-scoring-rule.md"
; role="common"
