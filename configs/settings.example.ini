; 執行方式、各平台 Sub-Agent 使用的 model 與 reasoning、報告語言，以及評分規則專案位置的範例（settings.ini 不進版控）。
; 不需要手動建立：第一次執行完整流程時，設定檢查會引導建立 configs/settings.ini。
; 若要預先設定，請在專案根目錄複製為 configs/settings.ini 後，取消註解要使用的區段並修改：
;   cp configs/settings.example.ini configs/settings.ini
;
; [workflow] 區段（必要）
;   subagent   true：每一步派發一個 Sub-Agent 執行；false：只由主 Agent 逐步執行。
;              平台不支援 Sub-Agent 時，即使設為 true 也由主 Agent 逐步執行。
;
; 平台區段（只有 subagent 為 true 時需要），區段名稱為平台名稱（例如 Claude、Copilot、Codex、Gemini；workflow、language 與 rules 為保留名稱）。
;   model      Sub-Agent 使用的 model，須為該平台 Sub-Agent 工具接受的值。
;   reasoning  Sub-Agent 的 reasoning 等級（GitHub Copilot 目前不會套用，見 docs/zh-tw/notices.md）。
;
; [workflow]
; subagent="true"
;
; [Claude]
; model="sonnet 5.5"
; reasoning="high"
;
; [Codex]
; model="gpt-5.6"
; reasoning="xhigh"
;
; [language] 區段（可省略）
;   report     報告使用的語言，即專案根目錄 templates/ 下的語言資料夾名稱（例如 zh-tw、en；預設 zh-tw）。
;              決定報告模板（report-template.md、labels.tsv），以及步驟 2、3 撰寫說明文字的語言。
;              templates/ 下只有一種語言的報告模板時（不論是否放在語言資料夾中），忽略此設定，直接使用該模板。
;
; [language]
; report="zh-tw"
;
; [rules] 區段（必要）
;   root       評分規則專案（例如 code-review-scoring-rules）的根目錄，完整路徑或相對於本檔所在目錄（configs/）的路徑。
;              Windows 請使用斜線，例如 C:/Users/me/Documents/code-review-scoring-rules。
;              規則專案根目錄有 rules.ini（登錄與啟用規則）、defaults.ini（預設的面向配分、嚴重度分級與等級），
;              以及每套規則一個目錄（rule.ini、評分規則文件與掃描規則）；寫法見 templates/<language>/rule-template.ini。
;
; [rules]
; root="../../code-review-scoring-rules"
