; 執行方式、各平台 Sub-Agent 使用的 model 與 reasoning，以及評分配分的範例（settings.ini 不進版控）。
; 不需要手動建立：第一次執行完整流程時，設定檢查會引導建立 configs/settings.ini。
; 若要預先設定，請在專案根目錄複製為 configs/settings.ini 後，取消註解要使用的區段並修改：
;   cp configs/settings.example.ini configs/settings.ini
;
; [workflow] 區段（必要）
;   subagent   true：每一步派發一個 Sub-Agent 執行；false：只由主 Agent 逐步執行。
;              平台不支援 Sub-Agent 時，即使設為 true 也由主 Agent 逐步執行。
;
; 平台區段（只有 subagent 為 true 時需要），區段名稱為平台名稱（例如 Claude、Copilot、Codex、Gemini；workflow 為保留名稱）。
;   model      Sub-Agent 使用的 model，須為該平台 Sub-Agent 工具接受的值。
;   reasoning  Sub-Agent 的 reasoning 等級（GitHub Copilot 目前不會套用，見 docs/notices.md）。
;
; [workflow]
; subagent="true"
;
; [Claude]
; model="sonnet 5.5"
; reasoning="high"
;
; [Codex]
; model="gpt-5.6"
; reasoning="xhigh"
;
; 評分配分（可省略，未設定的項目使用以下預設值）。數值為整數，修改後重新執行打分數步驟即可生效。
;   [points]      各面向滿分，七個面向合計必須為 100（各評分標準可在 configs/standards.ini 覆寫）：
;                 A 正確性、B 安全性、C 測試品質、D 架構與設計、E 效能與資源、F 可讀性、G 可維護性
;   [deductions]  各嚴重度每筆扣分項扣的分數（所有問題都會扣分，包括 Nit），以及是否合併扣分：
;                 merge="false"  不合併（預設）：每一處問題各為一筆扣分項，同一個檢查代碼出現在三處就扣三次
;                 merge="true"   合併：同一個檢查代碼只寫一筆並列出所有位置，只扣一次
;   [grades]      各等級的最低總分，必須 S > A > B > C；低於 C 為 D
;   對應不到檢查項的問題與上游因素直接從總分扣分。有 Critical 扣分項時，等級上限固定為 B。
;
; [points]
; A="25"
; B="15"
; C="15"
; D="15"
; E="10"
; F="10"
; G="10"
;
; [deductions]
; Critical="10"
; Major="5"
; Minor="2"
; Nit="1"
; merge="false"
;
; [grades]
; S="95"
; A="85"
; B="70"
; C="55"
