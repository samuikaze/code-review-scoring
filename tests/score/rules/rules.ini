; legacy has the check items of the rules.tsv used before the standards; common is the common standard.
; points overrides the points, scaled has its own five-level severity scale, grades and merge=true.
[legacy]
path="legacy"
enable="true"

[common]
path="common"
enable="true"

[points]
path="points"
enable="true"

[scaled]
path="scaled"
enable="true"

[off]
path="off"
enable="false"
