; 自己的嚴重度分級（中文顯示名稱）與等級
[rule]
standard="../../../plan/angular.md"
applies="*.ts, *.html"

[severity:Critical]
name="嚴重"
points="15"
cap="C"
meaning="資料損毀、資安事件或服務中斷。"

[severity:Major]
name="主要"
points="5"
meaning="特定情境下會出錯。"

[severity:Minor]
name="次要"
points="2"
meaning="能運作，但有更好的寫法。"

[severity:Nit]
name="細節"
points="0"
meaning="風格偏好。"

[grade:S]
name="優"
min="90"

[grade:C]
name="普通"
min="60"

[grade:F]
name="待加強"
min="0"
